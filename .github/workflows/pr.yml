name: PR

# TICKET-002: on every PR into main, lint + unit tests + build check must all
# pass before merge is allowed. The backend and android jobs are guarded so
# this workflow is a no-op (not a failure) until TICKET-101/TICKET-201 add
# those directories — `pr-required-checks` is the one status name branch
# protection should require, so it doesn't need to change later.
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: detect changed workspaces
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        run: |
          test -f backend/package.json && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          test -f android/settings.gradle.kts && echo "android=true" >> "$GITHUB_OUTPUT" || echo "android=false" >> "$GITHUB_OUTPUT"

  secrets-scan:
    name: secrets scan
    uses: ./.github/workflows/secrets-scan.yml

  backend:
    name: backend (lint, typecheck, test)
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  android:
    name: android (ktlint, test, assembleDebug)
    needs: detect
    if: needs.detect.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck
      - run: ./gradlew testDebugUnitTest
      - run: ./gradlew assembleDebug

  pr-required-checks:
    name: pr-required-checks
    if: always()
    # detect is listed too: if it fails, backend/android are skipped, and a skip
    # must not read as a pass when its gatekeeper never ran.
    needs: [detect, secrets-scan, backend, android]
    runs-on: ubuntu-latest
    steps:
      - name: fail if any required job failed
        run: |
          fail=0
          for result in "${{ needs.detect.result }}" "${{ needs.secrets-scan.result }}" "${{ needs.backend.result }}" "${{ needs.android.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              fail=1
            fi
          done
          if [ "$fail" = "1" ]; then
            echo "One or more required checks failed."
            exit 1
          fi
          echo "All required checks passed (or were not applicable yet)."
