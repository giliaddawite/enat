name: Secrets scan

# Reusable workflow — called from pr.yml and deploy.yml so both entry points
# share one gitleaks definition instead of drifting apart.
on:
  workflow_call:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history, not just the merge commit

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: only required if gitleaks starts rate-limiting on the
          # free tier. Safe to leave unset — an empty secret is a no-op.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
